<!DOCTYPE html>
<!-- community.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Stories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Community Stories</h1>
      <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="resourcepage.html">AI Resources</a></li>
        <li><a href="community.html">Community Stories</a></li>
      </ul>
    </nav>
  </header>

  <section class="contentCommunity">
    <h2>Share Your Story</h2>
    <form class="story-form">
      <input type="text" placeholder="Your name (optional)">
      <textarea placeholder="Share your experience..."></textarea>
      <button type="submit">Post Story</button>
    </form>

    <h2>Recent Posts</h2>
<div class="stories">
  <!-- Stories will be injected here -->
</div>
  </section>

  <footer>
        <p>© A.Tabouret Extended Inquiry Breast Cancer Awareness Project</p>
  </footer>

<script>
  const form = document.querySelector('.story-form');
  const storiesDiv = document.querySelector('.stories');
  const storiesKey = 'communityStories';

  function renderStories() {
    const stories = JSON.parse(localStorage.getItem(storiesKey)) || [];

    storiesDiv.innerHTML = stories.map(story => `
      <div class="story-card">
        <div class="story-header">
          ${story.name || 'Anonymous'}
          <span>shared a story</span>
        </div>
        <div class="story-text">
          ${story.text}
        </div>
      </div>
    `).join('');
  }

  form.addEventListener('submit', event => {
    event.preventDefault();

    const name = form.querySelector('input').value.trim();
    const text = form.querySelector('textarea').value.trim();
    if (!text) return;

    const stories = JSON.parse(localStorage.getItem(storiesKey)) || [];
    stories.unshift({ name, text }); // newest on top
    localStorage.setItem(storiesKey, JSON.stringify(stories));

    form.reset();
    renderStories();
  });

  renderStories();
</script>


</body>
</html>
